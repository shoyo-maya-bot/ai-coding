name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じブランチ・PR の古い実行は止める（main への push は最後まで走らせる）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java-gates:
    name: D1-D5,D9 (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: corretto
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: qualityGate
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue qualityGate 2>&1 | tee build.log
      - name: Show failures as annotations
        if: failure()
        run: |
          grep -E -A6 "What went wrong|\[ant:checkstyle\]|error:|FAILED|Rule violated|SpotBugs|Mapper XML" build.log \
            | head -60 | sed 's/^/::error::/' || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-reports
          path: template/build/reports/

  trace-gates:
    name: D6-D8,D10,D11 (traceability)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e "tools/spec-trace[dev]"
      - name: tools tests
        run: |
          (cd tools/spec-trace && python -m pytest -q)
          python -m pytest -q tests
      - name: lint
        run: ruff check tools scripts tests && ruff format --check tools scripts tests
      - name: spec-trace (all requirements proven, no drift)
        run: spec-trace check traceability/specs --root . --require proven --enforce-drift -f markdown
      - name: authority graph
        run: python scripts/verify_authority.py

  docs:
    name: docs (links, YAML/JSON, Copilot files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: check_docs
        run: python scripts/check_docs.py
