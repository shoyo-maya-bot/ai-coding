name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じブランチ・PR の古い実行は止める（main への push は最後まで走らせる）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java-gates:
    name: D1-D5,D9 (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: qualityGate
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue qualityGate 2>&1 | tee build.log
      - name: Show failures as annotations
        if: failure()
        run: |
          grep -E -A6 "What went wrong|\[ant:checkstyle\]|error:|FAILED|Rule violated|SpotBugs|Mapper XML" build.log \
            | head -60 | sed 's/^/::error::/' || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-reports
          path: template/build/reports/

  trace-gates:
    name: D6-D8,D10,D11 (traceability)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e "tools/spec-trace[dev]"
      - name: tools tests
        run: |
          (cd tools/spec-trace && python -m pytest -q)
          python -m pytest -q tests
      - name: lint
        run: ruff check tools scripts tests && ruff format --check tools scripts tests
      # PR は途中段階（実装済み・テスト未了）も通す: implemented 以上。main への push は全要件 proven を必須にする
      - name: spec-trace (PR は implemented 以上、main は全要件 proven。ドリフト無し)
        env:
          REQUIRE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'proven' || 'implemented' }}
        run: spec-trace check traceability/specs --root . --require "$REQUIRE" --enforce-drift -f markdown
      - name: authority graph
        run: python scripts/verify_authority.py

  docs:
    name: docs (links, YAML/JSON, Copilot files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: check_docs
        run: python scripts/check_docs.py

  template-drift:
    name: template drift (dev-environment sample-app)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # template/UPSTREAM.yaml の sha（写し元の commit）を取得して比べる。説明の無い差分があれば失敗
      - name: check_template_drift
        run: python scripts/check_template_drift.py
