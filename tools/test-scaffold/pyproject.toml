[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "test-scaffold"
version = "0.1.0"
description = "Excel のテスト仕様書から JUnit 5 のテストクラスの雛形を作る（LLM を使わない決定論のツール）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1.5",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.10"]

[project.scripts]
test-scaffold = "test_scaffold.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

# 組織共通の lint / format 設定（全ツールで同一に保つ。変えるときはテンプレートから直す）
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
