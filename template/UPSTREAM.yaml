# template/ の写し元と、わざと違えている箇所
# scripts/check_template_drift.py（CI の template-drift）がこれを読み、ここに無い差分があれば失敗する。
# 写し元を新しくするとき: --ref main で差分を見て template に取り込み（または理由を書き）、sha を更新する。
#
# 依存ライブラリ・Gradle の版の更新は、写し元（dev-environment）で行う（Dependabot も写し元で PR を出す）。
# template 側は、写し元にマージされた後で次の手順で取り込む（template 側で直接上げると、写し元とずれて template-drift が落ちる）:
#   1. python scripts/check_template_drift.py --ref main     # 写し元の main との差分を見る
#   2. 差分を template に写す（build.gradle は keep_in_sync の行だけ）
#   3. 下の sha を写し元の main のコミットに更新し、もう一度 python scripts/check_template_drift.py が通ることを確かめる
# このため .github/dependabot.yml の template の gradle は、写し元と揃える依存（keep_in_sync の対象）を ignore にしている。
repo: shoyo-maya-bot/dev-environment
sha: 7c8156086595f0b06235997d91eac6ac6d1a9d5a

# 写し元のディレクトリ → template 内のディレクトリ
mappings:
  - upstream: sample-app
    template: .
  - upstream: local
    template: local

# パスと中身の両方で置き換える（上から順に適用）
rename:
  - from: com.example.sample
    to: com.example.app
  - from: com/example/sample
    to: com/example/app
  - from: SampleApplication
    to: AppApplication

# 比べないもの（ビルド成果物など）
ignore:
  - build/
  - .gradle/
  - .idea/
  - bin/

allowed_differences:
  - path: build.gradle
    kind: modified
    reason: >-
      品質ゲート D1〜D5・D9（Checkstyle・SpotBugs・カバレッジ閾値・Mapper XML 検査・qualityGate タスク）を足している。
      ゲートの一覧は guidelines/quality-gates.md。プラグインと依存ライブラリの版は写し元に揃え続ける（keep_in_sync）
    keep_in_sync:
      - "^\\s*id '[^']+' version "
      - "^\\s*(implementation|runtimeOnly|compileOnly|annotationProcessor|testImplementation|testRuntimeOnly)\\b"
  - path: settings.gradle
    kind: replace
    replace:
      - from: "'sample-app'"
        to: "'app'"
    reason: 生成先プロジェクトの雛形なので、プロジェクト名をサンプル固有の名前から汎用名にしている
  - path: src/main/resources/application.yml
    kind: replace
    replace:
      - from: "name: sample-app"
        to: "name: app"
    reason: アプリ名を汎用名にしている（settings.gradle と同じ理由）
  - path: Dockerfile
    kind: replace
    replace:
      - from: "# sample-app のコンテナイメージの例（ECS Fargate の API・バッチ用. cloud/README.md の"
        to: "# app のコンテナイメージの例（ECS Fargate の API・バッチ用. dev-environment の cloud/README.md の"
      - from: "docker build -t sample-app:0.1.0 ."
        to: "docker build -t app:0.1.0 ."
      - from: "ARG JAR_FILE=build/libs/sample-app-0.1.0.jar"
        to: "ARG JAR_FILE=build/libs/app-0.1.0.jar"
      - from: "バッチのジョブフロー（cloud/modules/batch-workflow）"
        to: "バッチのジョブフロー（dev-environment の cloud/modules/batch-workflow）"
    reason: >-
      イメージ名と jar 名をプロジェクト名（settings.gradle の 'app'）に合わせている。
      template には cloud/ を持ち込まないので、案内先を dev-environment の手順書・モジュールと明記している
  - path: local/docker-compose.yml
    kind: replace
    replace:
      - from: "name: sample-dev"
        to: "name: app-dev"
    reason: >-
      Compose のプロジェクト名を変え、dev-environment のサンプルとコンテナ名・ボリューム名（DB のデータ）が混ざらないようにしている。
      ホスト側のポート（DB 5432・S3 エミュレータ 9090）は同じなので、そのままでは同時に起動できない
      （同時に使うときは、片方の local/.env で DB_PORT・S3_PORT を変え、アプリの接続先も環境変数で合わせる）
  - path: local/.env.example
    kind: replace
    replace:
      - from: （local/README.md の「ポート・パスワードを変えたとき」）
        to: （dev-environment の local/README.md の「ポート・パスワードを変えたとき」）
    reason: >-
      template には local/README.md を持ち込まない（下の removed）ので、案内先を dev-environment の手順書と明記している
  - path: src/main/java/com/example/app/AppApplication.java
    kind: modified
    reason: >-
      起動クラスの説明からサンプル固有の言い回しを外している（「サンプルアプリの起動クラス.」→「アプリの起動クラス.」）。
      また D2（Checkstyle）の行長制限に収めるため、batchRequested の呼び出しの 1 行を折り返している（処理は同じ）
  - path: src/main/java/com/example/app/common/ErrorResponse.java
    kind: modified
    reason: >-
      D5（SpotBugs）の EI_EXPOSE_REP 対策で、コンストラクタで List.copyOf して防御的コピーにしている。
      写し元には SpotBugs が無いので入っていない
  - path: src/main/java/com/example/app/order/ImportResult.java
    kind: modified
    reason: ErrorResponse と同じ（D5 の EI_EXPOSE_REP 対策で、errors・conflicts をコンパクトコンストラクタで List.copyOf して防御的コピーにしている）
  - path: src/main/java/com/example/app/order/batch/S3Config.java
    kind: modified
    reason: D2（Checkstyle）の行長制限に収めるため、長い 1 行を折り返している（処理は同じ）
  - path: src/main/java/com/example/app/order/batch/DefaultFileFetcher.java
    kind: modified
    reason: >-
      S3Config と同じ（D2 の行長制限）。コンストラクタの引数と、decodeUtf8 の Javadoc の 1 行を折り返している（処理は同じ）。
      また D5（SpotBugs）の CT_CONSTRUCTOR_THROW（上限の検査でコンストラクタが例外を投げる）に対し、除外ではなく
      SpotBugs の推奨どおりクラスを final にしている（継承されない Bean。写し元には SpotBugs が無い）
  - path: src/main/java/com/example/app/order/OrderImportService.java
    kind: modified
    reason: >-
      D2（Checkstyle）に合わせている。内容の違う重複のメッセージを作る長い 1 行を折り返し、
      splitCsv（循環的複雑度 19 > 上限 12）を、引用符で囲んだ値・囲まない値を読む小さなメソッドに分けている
      （分け方だけで、受け付ける形・例外のメッセージは同じ。OrderImportServiceTest で確かめる）
  - path: src/test/java/com/example/app/AppApplicationTest.java
    kind: modified
    reason: >-
      D2（Checkstyle）のメソッド名の規約（英小文字始まり）に合わせ、日本語のメソッド名を英語にして
      元の名前を @DisplayName に移している。長い 1 行も変数に分けて折り返している（検証の内容は同じ）
  - path: src/test/java/com/example/app/order/OrderImportServiceTest.java
    kind: modified
    reason: >-
      D6〜D8（spec-trace）で parseRejects の結果を照合するため、@ParameterizedTest に name（メソッド名で始まる）を付けている。
      同じ引数名（line, message）のパラメータ化テストが 2 つあり、既定の表示名「[番号] line = …, message = …」では見分けられないため。
      写し元には spec-trace が無い
  - path: src/test/java/com/example/app/order/batch/OrderImportJobRegistrationTest.java
    kind: modified
    reason: D2（Checkstyle）の行長制限に収めるため、値の配列と Map を変数に分けて折り返している（検証の内容は同じ）
  - path: src/test/java/com/example/app/order/batch/S3ConfigTest.java
    kind: modified
    reason: S3Config と同じ（D2 の行長制限）。URL を作る式を変数に分けて折り返している（検証の内容は同じ）
  - path: config/checkstyle/checkstyle.xml
    kind: added
    reason: D2（Checkstyle）の規約設定。写し元には静的解析が無い
  - path: config/spotbugs/exclude.xml
    kind: added
    reason: D5（SpotBugs）の除外設定（除外ごとに理由付き）。写し元には静的解析が無い
  - path: UPSTREAM.yaml
    kind: added
    reason: このファイル（写し元と許可差分の記録）
  - path: local/README.md
    kind: removed
    reason: >-
      PC の環境構築（WSL2・Rancher Desktop・Corretto の導入、../cloud/ への案内）の手順書で、
      dev-environment のディレクトリ構成を前提にしているので雛形には持ち込まない（環境構築は dev-environment 側を見る）
