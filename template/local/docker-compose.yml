# ローカル開発用のミドルウェア（DB と S3 エミュレータ）
#   起動: docker compose up -d --wait     停止: docker compose down     データも消す: docker compose down -v
# クラウドのサービスはエミュレータで代替し、ローカルからクラウドには接続しない。
# ポートは 127.0.0.1（この PC の中）だけで待ち受ける。パスワードが固定の開発用なので、同じネットワークの他の PC からはつながらないようにする。
name: app-dev

services:
  db:
    # タグ@sha256:digest で固定する（同じタグの中身が差し替わっても、全員が同じイメージを使う）. 更新は Dependabot（docker-compose）
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_DB: ${DB_NAME:-sampledb}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localpass}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # 初回起動時だけ実行される
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # S3 互換のエミュレータ。チームで別の製品を使う場合は .env の S3_EMULATOR_IMAGE で差し替える
    image: ${S3_EMULATOR_IMAGE:-adobe/s3mock:3.12.0@sha256:9da9c179bc0d1cb6986a40fd7ffbbc6deee11522b3892217ca350d65596126fa}
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-sample-bucket}
      initialBuckets: ${S3_BUCKET:-sample-bucket}
    ports:
      - "127.0.0.1:${S3_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
